[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remagent"
version = "1.1.1"
description = "Autonomous Zero-Vector Memory Framework for AI Agents with Biological REM Consolidation (Gemini, Anthropic, OpenAI-compatible, xAI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "RemAgent Core Team", email = "architect@dreamengine.dev" }
]
keywords = [
    "ai-agents",
    "memory",
    "zero-vector",
    "gemini",
    "anthropic",
    "claude",
    "openai",
    "xai",
    "cognitive-architecture",
    "hermes-agent",
    "rag-alternative",
    "llm-memory",
    "autonomous-agents"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-genai>=2.4.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
# LLM providers for the dream synthesizer. google-genai stays a BASE dependency
# for 1.x so `pip install remagent` + GEMINI_API_KEY keeps working; [gemini] is
# an alias extra for forward compatibility. xAI uses the [openai] extra.
gemini = [
    "google-genai>=2.4.0",
]
anthropic = [
    "anthropic>=1.0.0",
]
openai = [
    "openai>=1.40.0",
]
firestore = [
    "google-cloud-firestore>=2.14.0",
]
claude = [
    "mcp>=1.0.0",
]
all = [
    "remagent[gemini]",
    "remagent[anthropic]",
    "remagent[openai]",
    "remagent[firestore]",
    "remagent[claude]",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
dev = [
    "remagent[test]",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
remagent = "remagent.cli:main"
remagent-mcp = "remagent.integrations.claude_code:main"

[project.urls]
Homepage = "https://dreamengine.dev"
Repository = "https://github.com/Johnv412/rem-agent-"
Documentation = "https://remagent.dev"
